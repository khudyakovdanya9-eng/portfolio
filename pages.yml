# Настройка панели Pages CMS для портфолио.
# Здесь описано, какие поля есть у каждой работы и куда сохраняются картинки.

media:
  input: media
  output: /media

content:
  - name: works
    label: Мои работы
    type: file
    path: data/works.json
    format: json
    fields:
      - name: works
        label: Проекты
        type: object
        list: true
        fields:
          - name: title
            label: Название
            type: string
          - name: tag
            label: Метка
            type: select
            options:
              values:
                - Заказ клиента
                - Личный проект
                - Учебная работа
                - Демо с анимацией
          - name: text
            label: Короткое описание
            type: text
          - name: url
            label: Ссылка на сайт (https://...)
            type: string
          - name: img
            label: Картинка (скриншот сайта)
            type: image
